server:
  port: 8084

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/e-order-service
    username: root
    password: Deep@2009

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    io.github.resilience4j: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      productService:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      productService:
        maxAttempts: 3
        maxDuration: 2s


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/